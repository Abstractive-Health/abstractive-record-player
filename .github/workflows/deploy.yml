name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to record-player.abstractive.ai
    # Forks don't have (or need) Abstractive's Cloudflare credentials.
    if: github.repository == 'Abstractive-Health/abstractive-record-player' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://record-player.abstractive.ai
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.156.0 pages deploy dist
          --project-name abstractive-record-player --branch main
          --commit-hash "$GITHUB_SHA" --commit-dirty=true
      - name: Smoke test
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" https://record-player.abstractive.ai/)
          if [ "$status" != "200" ]; then
            echo "::error::https://record-player.abstractive.ai/ returned HTTP $status"
            exit 1
          fi
